name: Productivity pipeline

on:
  schedule:
    # 08:00, 14:00, 20:00 UTC
    - cron: "0 8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Vincent-Code
    env:
      OBSIDIAN_VAULT_PATH: ${{ github.workspace }}/Cerebro-Vincent
      SLACK_INPUT_OBSIDIAN_REL: 0_Diario_Productividad/Input
      WHISPER_PROVIDER: openai
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4o-mini
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Vincent-Code/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_CHANNEL_ID: ${{ secrets.SLACK_DM_CHANNEL_ID }}
          SLACK_WORKSPACE_DOMAIN: ${{ secrets.SLACK_WORKSPACE_DOMAIN }}
          SLACK_HUMAN_USER_ID: ${{ secrets.SLACK_HUMAN_USER_ID }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_TASKS_DATABASE_ID: ${{ secrets.NOTION_TASKS_DATABASE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bash scripts/run_productivity_pipeline.sh

      - name: Persist vault changes
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cerebro-Vincent/
          if git diff --staged --quiet; then
            echo "No vault changes to commit."
          else
            git commit -m "chore: productivity pipeline run ${{ github.run_id }}"
            git push
          fi
