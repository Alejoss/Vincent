name: Slack inbox sync

on:
  schedule:
    # Step 1 of daily cycle: ingest Slack -> Obsidian (8/14/20 UTC)
    - cron: "0 8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

# All productivity writers share this lock, including manual runs.
concurrency:
  group: productivity-vault-main
  cancel-in-progress: false
  queue: max

jobs:
  inbox-sync:
    runs-on: ubuntu-latest
    environment: Ramdau
    defaults:
      run:
        working-directory: Vincent-Code
    env:
      OBSIDIAN_VAULT_PATH: ${{ github.workspace }}/Cerebro-Vincent
      SLACK_INPUT_OBSIDIAN_REL: 0_Diario_Productividad/Input
      WHISPER_PROVIDER: openai
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4o-mini
      PIPELINE_RECLASSIFY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve main after acquiring the lock, not the triggering commit.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Vincent-Code/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Slack inbox
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_CHANNEL_ID: ${{ secrets.SLACK_DM_CHANNEL_ID }}
          SLACK_WORKSPACE_DOMAIN: ${{ secrets.SLACK_WORKSPACE_DOMAIN }}
          SLACK_HUMAN_USER_ID: ${{ secrets.SLACK_HUMAN_USER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bash scripts/run_slack_inbox_sync.sh

      - name: Upload inbox sync log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slack-inbox-sync-log-${{ github.run_id }}
          path: Vincent-Code/logs/slack_inbox_sync.log
          if-no-files-found: ignore

      - name: Persist vault changes
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cerebro-Vincent/
          if git diff --staged --quiet; then
            echo "No vault changes to commit."
          else
            git commit -m "chore: slack inbox sync run ${{ github.run_id }}"
            git fetch origin main
            git pull --rebase origin main
            git push origin HEAD:main
          fi
