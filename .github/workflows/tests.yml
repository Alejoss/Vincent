name: Python tests

on:
  push:
    branches: [main]
    paths:
      - "Vincent-Code/**"
      - "Cerebro-Vincent/Campaigns/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "Vincent-Code/**"
      - "Cerebro-Vincent/Campaigns/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Vincent-Code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Vincent-Code/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check application imports
        run: python -c "import src.mcp.server; import src.sophia_topic_text; import src.podcast_catalog; import src.podcast_covers"
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
