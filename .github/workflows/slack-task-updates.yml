name: Slack task updates

on:
  schedule:
    # After inbox (:00); before classify (:42) and reminders (:45)
    - cron: "40 8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task-updates:
    runs-on: ubuntu-latest
    environment: Ramdau
    defaults:
      run:
        working-directory: Vincent-Code
    env:
      OBSIDIAN_VAULT_PATH: ${{ github.workspace }}/Cerebro-Vincent
      WHISPER_PROVIDER: openai
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4o-mini
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Vincent-Code/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply Slack task updates
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_CHANNEL_ID: ${{ secrets.SLACK_DM_CHANNEL_ID }}
          SLACK_WORKSPACE_DOMAIN: ${{ secrets.SLACK_WORKSPACE_DOMAIN }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_TASKS_DATABASE_ID: ${{ secrets.NOTION_TASKS_DATABASE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bash scripts/run_slack_task_updates.sh

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slack-task-updates-log-${{ github.run_id }}
          path: Vincent-Code/logs/slack_task_updates.log
          if-no-files-found: ignore

      - name: Persist vault and audit
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cerebro-Vincent/ Vincent-Code/state/slack_task_updates_audit.jsonl
          if git diff --staged --quiet; then
            echo "No vault or audit changes to commit."
          else
            git commit -m "chore: slack task updates run ${{ github.run_id }}"
            git fetch origin main
            git pull --rebase origin main
            git push origin HEAD:main
          fi
