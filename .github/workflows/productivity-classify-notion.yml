name: Productivity classify and Notion sync

on:
  schedule:
    # After task updates (:40); before reminders (:45)
    - cron: "42 8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classify-notion:
    runs-on: ubuntu-latest
    environment: Ramdau
    defaults:
      run:
        working-directory: Vincent-Code
    env:
      OBSIDIAN_VAULT_PATH: ${{ github.workspace }}/Cerebro-Vincent
      SLACK_INPUT_OBSIDIAN_REL: 0_Diario_Productividad/Input
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4o-mini
      PIPELINE_RECLASSIFY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Vincent-Code/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Classify and sync to Notion
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_TASKS_DATABASE_ID: ${{ vars.NOTION_TASKS_DATABASE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bash scripts/run_productivity_classify_notion.sh

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: productivity-classify-notion-log-${{ github.run_id }}
          path: Vincent-Code/logs/productivity_classify_notion.log
          if-no-files-found: ignore

      - name: Persist vault changes
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cerebro-Vincent/
          if git diff --staged --quiet; then
            echo "No vault changes to commit."
          else
            git commit -m "chore: productivity classify+notion run ${{ github.run_id }}"
            git push
          fi
